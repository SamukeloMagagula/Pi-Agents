# Copy to agent.ini and edit. agent.ini is git-ignored: it holds secrets.

[hub]
# Address of the hub this agent reports to.
host = hub.example.lan
# Hub TCP port (default 55555).
port = 55555
# The hub's key fingerprint, shown by the hub. The agent refuses any other hub.
fingerprint = PASTE-HUB-FINGERPRINT-HERE

[agent]
# Where this agent's private key is stored (created on first start).
# Windows example: C:\ProgramData\devmon\agent.key
key_path = /var/lib/devmon/agent.key
# One of: pi, linux, windows-laptop, windows-server. Leave blank to auto-detect.
device_kind =

# Uncomment to also monitor a MariaDB/MySQL server on this machine.
# The account needs only: GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* (see docs/RUNNING.md).
# [mariadb]
# host = 127.0.0.1
# port = 3306
# user = devmon_monitor
# password = CHANGE-ME
# Name shown on the dashboard (default: host:port).
# instance = main-db
# Comma-separated schemas to leave out of the report.
# exclude_schemas = test, scratch

# Attack detection (on by default). Uncomment only to change something.
# [events]
# enabled = yes
# A MariaDB error log file, if MariaDB logs to a file rather than the system journal.
# Default: /var/log/mysql/error.log or /var/log/mariadb/mariadb.log, if either exists.
# mariadb_log = /var/log/mysql/error.log
# DatabaseAdministration's audit table (database.table), read with the [mariadb] account
# for failed dashboard sign-ins. The account needs SELECT on that table.
# dbadmin_audit_table = dbadmin.audit_log
# Windows only: where Windows Firewall logs dropped packets (the installer sets this up).
# firewall_log = C:\ProgramData\DevMon\fwlog\pfirewall.log
# Web server access log (nginx/apache combined format) to scan for SQLi/XSS attacks.
# Default: /var/log/nginx/access.log, /var/log/apache2/access.log or
# /var/log/httpd/access_log, if one exists. The agent user needs read access (e.g. the
# adm group on Debian). It only reads the log; it never blocks a request itself.
# web_log = /var/log/nginx/access.log

# Self-healing (Linux). The fixer is a small root service the installer sets up; the agent
# passes it the hub's requests. Leave this as it is unless you moved the fixer's socket.
# [healing]
# fixer_socket = /run/devmon-fixer/fixer.sock

# Signed heartbeats between agents (UDP), so the hub can tell "device down" from "device
# cut off from the hub", and devices can block attackers together while the hub is down.
# On by default on Linux.
# [gossip]
# enabled = yes
# port = 55556
