# devmon fixer: what the hub may ask this device to do to heal itself.
# Installed as /etc/devmon/fixer.ini (root-only). The installer never overwrites your copy.
# After a change: sudo systemctl restart devmon-fixer
#
# The dashboard's Self-healing page sets which fixes happen automatically, which wait for
# you and which are off. This file is the device's own limit on top of that: an action
# left out here is refused even if the hub asks.

[fixer]
# All of: restart_service, stop_process, free_memory, disk_cleanup, cool_down, block_ip,
#         unblock_ip, reboot
enabled_actions = restart_service, stop_process, free_memory, disk_cleanup, cool_down,
    block_ip, unblock_ip, reboot

# Never stopped, in addition to the built-in list (systemd, sshd, databases, devmon, ...).
# Process names, separated by spaces or commas.
protected_processes =

# Never restarted, in addition to devmon's own services.
protected_units =

# Never blocked, in addition to this device, its hub and loopback. Addresses or ranges.
# The dashboard's trusted IPs are never blocked either.
never_block =

# Folders whose contents disk cleanup may delete entirely (a scratch area for jobs).
# Files over a week old in /tmp and /var/tmp are always cleaned up.
cleanup_dirs = /var/tmp/devmon-scratch

# Whether "stop the busiest process" may stop processes running as root.
stop_root_processes = no
